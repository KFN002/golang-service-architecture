<svg width="880" height="280" viewBox="0 0 880 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="distributed.calc — an expression DAG computing across agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b14"/>
      <stop offset="100%" stop-color="#12101f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00add8"/>
      <stop offset="100%" stop-color="#5dc9e2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="878" height="278" rx="18" fill="url(#bg)" stroke="#26263a" stroke-width="2"/>

  <!-- ============ left: wordmark ============ -->
  <text x="52" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="38" font-weight="800" fill="#e4e4ef">
    <tspan fill="#00add8">Σ</tspan> distributed<tspan fill="#00add8">.</tspan>calc
  </text>
  <rect x="54" y="134" width="300" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="width" values="0;300;300;300" keyTimes="0;0.15;0.9;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- rotating taglines -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#8a8aa3">
    <text x="54" y="172" opacity="0">
      fan-out → worker pools → fan-in
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.30;0.35;1" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="54" y="172" opacity="0">
      outbox · retry queues · circuit breakers
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.35;0.40;0.63;0.68;1" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="54" y="172" opacity="0">
      append-only audit · one trace, end to end
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.68;0.73;0.95;1" dur="16s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="54" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#3f3f5a">
    trace 2f68ea3ed46c5c0c… · 8 spans · 2 services · one click
  </text>

  <!-- ============ right: living DAG of ((1+2)*(3+4)) ============ -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <!-- edges -->
    <path d="M 630 88 C 672 88 672 140 712 140" stroke="#26263a" stroke-width="2" fill="none">
      <animate attributeName="stroke" values="#26263a;#26263a;#34d399;#34d399;#26263a" keyTimes="0;0.28;0.33;0.9;1" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M 630 192 C 672 192 672 140 712 140" stroke="#26263a" stroke-width="2" fill="none">
      <animate attributeName="stroke" values="#26263a;#26263a;#34d399;#34d399;#26263a" keyTimes="0;0.40;0.45;0.9;1" dur="8s" repeatCount="indefinite"/>
    </path>

    <!-- leaf task: 1+2 -->
    <g>
      <rect x="536" y="62" width="94" height="50" rx="10" fill="#12121a" stroke-width="2">
        <animate attributeName="stroke" values="#8a8aa3;#f59e0b;#34d399;#34d399;#8a8aa3" keyTimes="0;0.08;0.28;0.9;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="583" y="84" text-anchor="middle" fill="#e4e4ef">1 + 2</text>
      <text x="583" y="102" text-anchor="middle" fill="#34d399" opacity="0">= 3
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.28;0.33;0.9;1" dur="8s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- leaf task: 3+4 -->
    <g>
      <rect x="536" y="166" width="94" height="50" rx="10" fill="#12121a" stroke-width="2">
        <animate attributeName="stroke" values="#8a8aa3;#8a8aa3;#f59e0b;#34d399;#34d399;#8a8aa3" keyTimes="0;0.15;0.20;0.40;0.9;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="583" y="188" text-anchor="middle" fill="#e4e4ef">3 + 4</text>
      <text x="583" y="206" text-anchor="middle" fill="#34d399" opacity="0">= 7
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.40;0.45;0.9;1" dur="8s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- root task: * -->
    <g>
      <rect x="712" y="114" width="112" height="52" rx="10" fill="#12121a" stroke-width="2.5">
        <animate attributeName="stroke" values="#8a8aa3;#8a8aa3;#f59e0b;#34d399;#8a8aa3" keyTimes="0;0.45;0.50;0.70;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="768" y="136" text-anchor="middle" fill="#e4e4ef">3 × 7</text>
      <text x="768" y="154" text-anchor="middle" fill="#34d399" font-weight="700" opacity="0">= 21
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.70;0.75;0.92;1" dur="8s" repeatCount="indefinite"/>
      </text>
      <text x="768" y="102" text-anchor="middle" font-size="11" fill="#00add8">★ root</text>
    </g>

    <!-- worker attribution blips -->
    <text x="518" y="86" text-anchor="end" font-size="10" fill="#ce3262" opacity="0">agent-1
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.10;0.26;0.30;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="518" y="190" text-anchor="end" font-size="10" fill="#ce3262" opacity="0">agent-2
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.20;0.25;0.38;0.42;1" dur="8s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
