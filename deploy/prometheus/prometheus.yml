global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: orchestrator
    static_configs:
      - targets:
          - orchestrator-1:8080
          - orchestrator-2:8080
          - orchestrator-3:8080

  - job_name: agent
    static_configs:
      - targets:
          - agent-1:8082
          - agent-2:8082

  - job_name: audit
    static_configs:
      - targets:
          - audit-1:8081
          - audit-2:8081
