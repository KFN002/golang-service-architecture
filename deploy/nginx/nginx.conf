# nginx: the single public entrypoint. Load balancing, rate limiting,
# security headers, SSE-safe proxying, and private-service routing.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # ---- hardening ---------------------------------------------------------
    server_tokens off;                       # hide version
    client_max_body_size 64k;                # mirror app body cap
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Per-IP request rate + connection caps: the outermost throttle ring.
    limit_req_zone  $binary_remote_addr zone=api:10m   rate=50r/s;
    limit_req_zone  $binary_remote_addr zone=traces:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---- upstreams ---------------------------------------------------------
    # least_conn beats round-robin under uneven request cost; keepalive
    # pools cut per-request TCP/TLS overhead.
    upstream orchestrators {
        least_conn;
        server orchestrator-1:8080 max_fails=3 fail_timeout=10s;
        server orchestrator-2:8080 max_fails=3 fail_timeout=10s;
        server orchestrator-3:8080 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    upstream audits {
        least_conn;
        server audit-1:8081 max_fails=3 fail_timeout=10s;
        server audit-2:8081 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream web {
        server web:3000;
        keepalive 16;
    }

    server {
        listen 80;

        # Shared security headers (dashboards need scripts; API sets its own
        # stricter CSP at the Fiber layer).
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";

        # ---- SSE: no buffering, long-lived ---------------------------------
        location = /api/v1/events {
            limit_conn perip 20;
            proxy_pass http://orchestrators;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        # ---- audit API (separate service) ----------------------------------
        location /api/v1/audit/ {
            limit_req zone=api burst=100 nodelay;
            limit_conn perip 50;
            proxy_pass http://audits;
        }

        # ---- calculator API -------------------------------------------------
        location /api/ {
            limit_req zone=api burst=100 nodelay;
            limit_conn perip 50;
            proxy_pass http://orchestrators;
        }

        # ---- browser OTLP span export → private collector -------------------
        location = /v1/traces {
            limit_req zone=traces burst=40 nodelay;
            client_max_body_size 512k;      # span batches are bigger than API calls
            proxy_pass http://otel-collector:4318/v1/traces;
        }

        # ---- Jaeger query API (read-only) for the trace waterfall -----------
        location /jaeger-api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://jaeger:16686/api/;
        }

        # ---- dashboard ------------------------------------------------------
        location / {
            proxy_pass http://web;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
